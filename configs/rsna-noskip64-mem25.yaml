data:
  root: ../datasets/Med-AD_v1/RSNA
  manifest: data.json
  image_dir: images
  image_size: 64
  extra_unlabeled: 4000
  anomaly_ratio: 0.6
  workers: 0
  cache_images: true
  shuffle_unlabeled_pool: false
model:
  architecture: noskip
  latent_size: 128
  width_multiplier: 1.0
  memory_size: 25
  shrink_threshold: 0.0
train:
  batch_size: 128
  learning_rate: 0.0002
  weight_decay: 0.0
  epochs: 100
  ensemble_size: 3
  seed: 42
  resume: true
  optimizer: adam
  beta1: 0.5
  beta2: 0.999
  checkpoint_interval: 10
  entropy_loss_weight: 0.0002
experiment:
  output_dir: ../outputs/rsna-noskip64-mem25
  device: auto
