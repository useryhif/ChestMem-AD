data:
  root: ../datasets/RSNA
  manifest: data_ddad.json
  image_dir: images
  image_size: 64
  extra_unlabeled: 1000
  anomaly_ratio: 0.5
  workers: 0
  cache_images: true
model:
  latent_size: 32
  width_multiplier: 1.0
train:
  batch_size: 128
  learning_rate: 0.0005
  weight_decay: 0.0
  epochs: 30
  ensemble_size: 3
  seed: 42
  resume: true
experiment:
  output_dir: ../outputs/rsna-large
  device: auto
